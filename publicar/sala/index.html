<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala ao vivo · REINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--palco:#EEF0F3;--sup:#F5F6F8;--borda:#E3E5E9;--texto:#1D1F23;--apoio:#5F6670;--laranja:#D93F00;--laranja-h:#C23800;--laranja-claro:#FFF1EA;--barra:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--palco);color:var(--texto);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit}
.hide{display:none!important}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--laranja);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:17px;min-height:52px;padding:0 20px;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--laranja-h)}
.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #FFB894;outline-offset:2px}

/* ---------- Entrada ---------- */
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--borda);border-radius:16px;padding:32px 24px;box-shadow:0 8px 24px rgba(29,31,35,.06)}
.gate-card svg{width:36px;height:auto;margin-bottom:20px}
.gate-card h1{font-weight:800;font-size:clamp(24px,6vw,28px);line-height:1.2;margin-bottom:6px;letter-spacing:-.01em}
.gate-card p{color:var(--apoio);margin-bottom:24px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
input{width:100%;min-height:52px;background:var(--bg);color:var(--texto);border:1px solid var(--borda);border-radius:10px;padding:0 14px;margin-bottom:16px;font-size:17px}
input:focus{border-color:var(--laranja);outline:none;box-shadow:0 0 0 3px var(--laranja-claro)}
input::placeholder{color:#9AA0A8}
.erro{color:#B42318;font-weight:700;font-size:14px;margin:-6px 0 14px}
.miudo{font-size:12px;color:var(--apoio);margin-top:14px;text-align:center}

/* ---------- Sala (estilo Zoom) ---------- */
#sala{position:fixed;inset:0;display:flex;flex-direction:column}
.topo{height:var(--barra);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--borda)}
.topo svg{width:26px;height:auto;flex:none}
.topo h2{font-weight:800;font-size:15px;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--sup);color:var(--apoio);white-space:nowrap}
.badge.live{background:#FDECEC;color:#B42318}
.badge.live::before{content:"● ";animation:pisca 1.6s infinite}
@keyframes pisca{50%{opacity:.25}}

.palco{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}
.player{position:relative;width:min(100%, calc((100dvh - var(--barra)*2 - 24px) * 16 / 9));aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(29,31,35,.12)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.espera{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg)}
.espera strong{font-weight:800;font-size:clamp(20px,4vw,30px);line-height:1.2}
.espera span{color:var(--apoio);margin-top:8px}
.espera .dots{display:flex;gap:6px;margin-top:18px}
.espera .dots i{width:8px;height:8px;border-radius:50%;background:var(--laranja);animation:pula 1.2s infinite}
.espera .dots i:nth-child(2){animation-delay:.15s}.espera .dots i:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

.base{height:var(--barra);flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-top:1px solid var(--borda)}
.eu{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--texto);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.eu span{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eu small{display:block;font-weight:500;color:var(--apoio);font-size:12px}
.pill{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--borda);background:var(--bg);font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--texto);text-decoration:none}
.pill.laranja{background:var(--laranja);border-color:var(--laranja);color:#fff}
.pill.laranja:hover{background:var(--laranja-h)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--laranja)}

/* ---------- Pop-ups ---------- */
.pop{position:fixed;z-index:20;right:20px;bottom:calc(var(--barra) + 20px);width:min(380px, calc(100vw - 32px));background:var(--bg);border:1px solid var(--borda);border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(29,31,35,.22);animation:entra .35s cubic-bezier(.2,.9,.3,1.2)}
.pop.cta{border:2px solid var(--laranja)}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.pop-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pop-tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--laranja);background:var(--laranja-claro);padding:4px 10px;border-radius:999px}
.fechar{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--sup);color:var(--apoio);font-size:18px;line-height:1;cursor:pointer}
.fechar:hover{background:var(--borda)}
.pop h3{font-weight:800;font-size:18px;line-height:1.3;margin-bottom:14px}
.pop p{color:var(--apoio);margin:-6px 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;min-height:48px;padding:0 16px;background:var(--bg);color:var(--texto);border:1px solid var(--borda);border-radius:10px;text-align:left;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--laranja);background:var(--laranja-claro)}
.toast{position:fixed;z-index:30;left:50%;top:calc(var(--barra) + 14px);transform:translateX(-50%);background:var(--texto);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;animation:entra .3s ease;white-space:nowrap}

@media(max-width:640px){
  :root{--barra:58px}
  .palco{padding:0}
  .player{width:100%;border-radius:0;box-shadow:none}
  .pop{left:0;right:0;bottom:0;width:100%;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}
  .pop.cta{border-width:2px 0 0}
  .base{padding-bottom:env(safe-area-inset-bottom);height:calc(var(--barra) + env(safe-area-inset-bottom))}
  .eu small{display:none}
}
</style>
</head>
<body>

<!-- ENTRADA -->
<section id="gate" class="hide">
  <form class="gate-card" id="form" novalidate>
    <svg viewBox="0 0 88 84" role="img" aria-label="Símbolo Reino"><g fill="#3B101D"><path d="M12 72V12H68V44H44V28H28V72Z"/><path d="M40 48H56L76 72H54L40 56Z"/></g></svg>
    <h1 id="gTitulo">Sala ao vivo</h1>
    <p>Digite seu nome e WhatsApp para entrar.</p>
    <label for="nome">Seu nome</label>
    <input id="nome" autocomplete="given-name" placeholder="Como você quer ser chamado" required>
    <label for="tel">WhatsApp com DDD</label>
    <input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" required>
    <div class="erro hide" id="erro"></div>
    <button class="btn" id="entrar" type="submit">Entrar na sala</button>
    <div class="miudo">Usamos seu WhatsApp só para falar com você sobre este evento.</div>
  </form>
</section>

<!-- SALA -->
<main id="sala" class="hide">
  <div class="topo">
    <svg viewBox="0 0 88 84" aria-hidden="true"><g fill="#3B101D"><path d="M12 72V12H68V44H44V28H28V72Z"/><path d="M40 48H56L76 72H54L40 56Z"/></g></svg>
    <h2 id="titulo"></h2>
    <span class="badge" id="badge"></span>
  </div>

  <div class="palco"><div class="player" id="player"></div></div>

  <div class="base">
    <div class="eu"><div class="avatar" id="avatar"></div><div><span id="eu"></span><small>Você está na sala</small></div></div>
    <button class="pill hide" id="pillEnq" type="button"><i class="dot"></i>Enquete</button>
    <button class="pill laranja hide" id="pillCta" type="button">Agendar sessão</button>
  </div>
</main>

<!-- POP-UP ENQUETE -->
<div class="pop hide" id="popEnq" role="dialog" aria-labelledby="pergunta">
  <div class="pop-top"><span class="pop-tag">Enquete</span><button class="fechar" type="button" aria-label="Responder depois" data-fecha="enq">×</button></div>
  <h3 id="pergunta"></h3>
  <div class="opts" id="opts"></div>
</div>

<!-- POP-UP AGENDA -->
<div class="pop cta hide" id="popCta" role="dialog" aria-labelledby="ctaTit">
  <div class="pop-top"><span class="pop-tag">Vagas abertas agora</span><button class="fechar" type="button" aria-label="Fechar" data-fecha="cta">×</button></div>
  <h3 id="ctaTit">Sua sessão individual</h3>
  <p>Escolha um horário para conversar com o time e montar o seu plano.</p>
  <a class="btn" id="ctaBtn" target="_blank" rel="noopener"></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://lcbymyvzhnwcmpdukyqr.supabase.co';
const SB_KEY = 'sb_publishable_IUgbqJrPeXTe-N1daV5piA_S_IIewvp';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });

const qs = new URLSearchParams(location.search);
const SLUG = (qs.get('w') || location.hash.replace('#','') || '').trim();
const KEY = 'sala:' + SLUG;
const $ = id => document.getElementById(id);

let W = null;          // linha do webinar
let ME = null;         // {id, token, nome, tel, enquete_resposta}
let playerVid = null;  // vídeo já montado
const fechado = { enq: false, cta: false };   // pessoa minimizou o pop-up
const visto = { enq: false, cta: false };     // já tocou o aviso desta abertura

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(ME)); } catch(e){} }

function mascara(v){
  const d = v.replace(/\D/g,'').slice(0,11);
  if (d.length <= 2) return d ? '(' + d : '';
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
$('tel').addEventListener('input', e => { e.target.value = mascara(e.target.value); });

async function carregarWebinar(){
  const { data, error } = await sb.from('sala_webinars').select('*').eq('slug', SLUG).maybeSingle();
  if (error || !data) return null;
  return data;
}

function erro(msg){ const e = $('erro'); e.textContent = msg; e.classList.toggle('hide', !msg); }
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

// "plim" curto quando chega uma notificação (só toca depois que a pessoa clicou em Entrar)
let audio = null;
function plim(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.18, t + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.35);
      o.connect(g).connect(audio.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.4);
    });
  } catch(e){}
}

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const nome = $('nome').value.trim();
  const tel = $('tel').value.replace(/\D/g,'');
  if (nome.length < 2) return erro('Digite seu nome.');
  if (tel.length < 10) return erro('Digite seu WhatsApp com DDD.');
  erro(''); $('entrar').disabled = true; $('entrar').textContent = 'Entrando…';
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  const { data, error } = await sb.rpc('sala_entrar', { p_slug: SLUG, p_nome: nome, p_telefone: tel, p_ua: navigator.userAgent });
  $('entrar').disabled = false; $('entrar').textContent = 'Entrar na sala';
  if (error) return erro(/telefone/.test(error.message) ? 'Confira o número do WhatsApp.' : 'Não conseguimos te colocar na sala. Tente de novo.');
  ME = { id: data.id, token: data.token, nome, tel, enquete_resposta: data.enquete_resposta };
  save(); abrirSala();
});

function abrirSala(){
  $('gate').classList.add('hide');
  $('sala').classList.remove('hide');
  const n = ME.nome.trim();
  $('eu').textContent = n.split(/\s+/)[0];
  $('avatar').textContent = n.charAt(0).toUpperCase();
  render();
  ping(); setInterval(ping, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
  ouvir();
}

async function ping(){
  if (!ME) return;
  const { data } = await sb.rpc('sala_ping', { p_id: ME.id, p_token: ME.token });
  if (data === false) { localStorage.removeItem(KEY); location.reload(); }
}

// minimizar / reabrir
document.querySelectorAll('[data-fecha]').forEach(b => b.onclick = () => { fechado[b.dataset.fecha] = true; render(); });
$('pillEnq').onclick = () => { fechado.enq = false; render(); };
$('pillCta').onclick = () => { fechado.cta = false; render(); };

function render(){
  if (!W) return;
  document.title = W.titulo + ' · Ao vivo';
  $('titulo').textContent = W.titulo;
  const b = $('badge');
  b.className = 'badge' + (W.status === 'ao_vivo' ? ' live' : '');
  b.textContent = W.status === 'ao_vivo' ? 'Ao vivo' : W.status === 'encerrado' ? 'Encerrada' : 'Em breve';

  // Vídeo
  const p = $('player');
  if (W.status === 'encerrado') {
    playerVid = null;
    p.innerHTML = '<div class="espera"><strong>A transmissão terminou</strong><span>Obrigado por estar com a gente.</span></div>';
  } else if (W.youtube_id && W.status === 'ao_vivo') {
    if (playerVid !== W.youtube_id) {
      playerVid = W.youtube_id;
      p.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(W.youtube_id)}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Transmissão ao vivo"></iframe>`;
    }
  } else if (!p.querySelector('.espera.aguarda')) {
    playerVid = null;
    p.innerHTML = '<div class="espera aguarda"><strong>Começa em instantes</strong><span>Deixe esta página aberta. A transmissão aparece aqui sozinha.</span><div class="dots"><i></i><i></i><i></i></div></div>';
  }

  // Enquete
  const respondeu = ME && ME.enquete_resposta !== null && ME.enquete_resposta !== undefined;
  const enqAtiva = W.enquete_aberta && !respondeu;
  if (!W.enquete_aberta) { visto.enq = false; fechado.enq = false; }
  const mostraEnq = enqAtiva && !fechado.enq;
  if (mostraEnq && $('popEnq').classList.contains('hide')) {
    $('pergunta').textContent = W.enquete_pergunta;
    const box = $('opts'); box.innerHTML = '';
    (W.enquete_opcoes || []).forEach((txt, i) => {
      const o = document.createElement('button');
      o.className = 'opt'; o.type = 'button'; o.textContent = txt;
      o.onclick = () => responder(i);
      box.appendChild(o);
    });
    if (!visto.enq) { visto.enq = true; plim(); }
  }
  $('popEnq').classList.toggle('hide', !mostraEnq);
  $('pillEnq').classList.toggle('hide', !(enqAtiva && fechado.enq));

  // Agenda
  const ctaAtiva = !!(W.cta_visivel && W.agenda_url);
  if (!W.cta_visivel) { visto.cta = false; fechado.cta = false; }
  const mostraCta = ctaAtiva && !fechado.cta && !mostraEnq;   // um pop-up por vez
  if (ctaAtiva) {
    const u = new URL(W.agenda_url);
    u.searchParams.set('name', ME.nome);
    u.searchParams.set('phone', ME.tel);
    u.searchParams.set('utm_source', 'sala');
    u.searchParams.set('utm_campaign', SLUG);
    const a = $('ctaBtn'); a.href = u.toString(); a.textContent = W.cta_texto;
    a.onclick = () => { sb.rpc('sala_clicou', { p_id: ME.id, p_token: ME.token }); };
    if (mostraCta && !visto.cta) { visto.cta = true; plim(); }
  }
  $('popCta').classList.toggle('hide', !mostraCta);
  $('pillCta').classList.toggle('hide', !(ctaAtiva && !mostraCta));
  $('pillCta').textContent = ctaAtiva ? W.cta_texto.replace(/^quero\s+/i, '').replace(/^./, c => c.toUpperCase()) : '';
}

async function responder(i){
  ME.enquete_resposta = i; save(); render();
  toast('✓ Resposta registrada');
  await sb.rpc('sala_responder', { p_id: ME.id, p_token: ME.token, p_resposta: i });
}

function ouvir(){
  sb.channel('sala-' + W.id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sala_webinars', filter: 'id=eq.' + W.id },
        payload => { W = payload.new; render(); })
    .subscribe();
  setInterval(async () => { const n = await carregarWebinar(); if (n) { W = n; render(); } }, 20000);
}

(async function init(){
  if (!SLUG) { document.body.innerHTML = '<div style="padding:40vh 16px 0;text-align:center">Link da sala incompleto.</div>'; return; }
  W = await carregarWebinar();
  if (!W) { document.body.innerHTML = '<div style="padding:40vh 16px 0;text-align:center">Sala não encontrada. Confira o link.</div>'; return; }
  $('gTitulo').textContent = W.titulo;
  ME = load();
  if (ME && ME.id && ME.token) abrirSala();
  else $('gate').classList.remove('hide');
})();
</script>
</body>
</html>
