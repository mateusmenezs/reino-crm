const fmtFone = (p)=>{ const d=String(p||"").replace(/\D/g,""); if(d.length===13&&d.startsWith("55")) return "+55 ("+d.slice(2,4)+") "+d.slice(4,9)+"-"+d.slice(9); if(d.length===12&&d.startsWith("55")) return "+55 ("+d.slice(2,4)+") "+d.slice(4,8)+"-"+d.slice(8); return d?("+"+d):""; };

function ThemeToggle(){
  const [dark,setDark]=useState(()=>document.documentElement.getAttribute("data-theme")==="dark");
  return h("button",{className:"out",onClick:()=>{ const nd=!dark; document.documentElement.setAttribute("data-theme",nd?"dark":"light"); try{localStorage.setItem("reino-theme",nd?"dark":"light");}catch(e){} setDark(nd); }},dark?"☀ claro":"🌙 escuro");
}

/* ---------- config da IA ---------- */
function IAConfig({onClose,onToast}){
  const [ativa,setAtiva]=useState(true),[prompt,setPrompt]=useState(""),[modelo,setModelo]=useState("claude-sonnet-5"),[ok,setOk]=useState(false),[busy,setBusy]=useState(false);
  useEffect(()=>{ (async()=>{
    const r=await sb.from("crm_config").select("chave,valor").in("chave",["oficial_ia_ativa","oficial_ia_prompt","oficial_ia_modelo"]);
    (r.data||[]).forEach(x=>{ if(x.chave==="oficial_ia_ativa")setAtiva(x.valor==="true"); if(x.chave==="oficial_ia_prompt")setPrompt(x.valor||""); if(x.chave==="oficial_ia_modelo")setModelo(x.valor||"claude-sonnet-5"); });
    setOk(true); })(); },[]);
  const salvar=async()=>{ setBusy(true); const now=new Date().toISOString();
    const r=await sb.from("crm_config").upsert([{chave:"oficial_ia_ativa",valor:ativa?"true":"false",atualizado_em:now},{chave:"oficial_ia_prompt",valor:prompt,atualizado_em:now},{chave:"oficial_ia_modelo",valor:modelo,atualizado_em:now}],{onConflict:"chave"});
    setBusy(false); if(r.error) return onToast("Erro ao salvar: "+r.error.message); onToast("IA salva ✓"); onClose(); };
  return h("div",{className:"overlay",onClick:onClose},
    h("div",{className:"modal",style:{maxWidth:760},onClick:e=>e.stopPropagation()},
      h("h3",null,"🤖 IA do WhatsApp Oficial"),
      h("p",{style:{fontSize:13,color:"var(--muted)",margin:"-8px 0 14px",lineHeight:1.5}},"Responde sozinha quem chama no número oficial. Quando precisa de alguém, avisa o cliente, passa a conversa pro time e escreve o motivo em \"Próxima ação\". Se o time responder, a IA fica 12h quieta naquela conversa."),
      !ok?h("div",{className:"center"},h("div",{className:"spin"})):h(Fr,null,
        h("label",{style:{display:"flex",alignItems:"center",gap:8,fontWeight:700,marginBottom:12,cursor:"pointer"}},
          h("input",{type:"checkbox",checked:ativa,onChange:e=>setAtiva(e.target.checked)}),
          ativa?"IA ligada":"IA desligada (ninguém recebe resposta automática)"),
        h("div",{className:"field"},h("label",null,"Instruções da IA"),
          h("textarea",{value:prompt,onChange:e=>setPrompt(e.target.value),rows:16,style:{lineHeight:1.5,resize:"vertical",background:"var(--card)",color:"var(--ink)"}})),
        h("div",{className:"field"},h("label",null,"Modelo"),
          h("select",{value:modelo,onChange:e=>setModelo(e.target.value),style:{background:"var(--card)",color:"var(--ink)"}},
            h("option",{value:"claude-sonnet-5"},"Claude Sonnet 5 (recomendado)"),
            h("option",{value:"claude-haiku-5-5"},"Claude Haiku 5.5 (mais barato)"),
            h("option",{value:"claude-opus-5-5"},"Claude Opus 5.5 (mais caprichado)"))),
        h("div",{className:"modal-acts"},
          h("button",{className:"btn ghost",onClick:onClose},"Cancelar"),
          h("button",{className:"btn gold",onClick:salvar,disabled:busy},busy?"Salvando…":"Salvar")))));
}

/* ---------- conversa aberta ---------- */
function Thread({conv,stages,userId,onBack,onToast}){
  const [msgs,setMsgs]=useState(null),[text,setText]=useState(""),[sending,setSending]=useState(false);
  const endRef=useRef(null);
  const ct=conv.contacts||{};
  const st=estadoIA(conv);
  const load=useCallback(async()=>{
    const {data}=await sb.from("messages").select("id,direction,text,ig_message_id,sender_id,sent_by,raw,attachment_type,created_at").eq("conversation_id",conv.id).order("created_at").limit(500);
    setMsgs(data||[]);
    if(conv.unread_count>0) sb.from("conversations").update({unread_count:0}).eq("id",conv.id).then(()=>{});
  },[conv.id]);
  useEffect(()=>{ setMsgs(null); load(); },[load]);
  useEffect(()=>{ const ch=sb.channel("th-"+conv.id).on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"conversation_id=eq."+conv.id},()=>load()).subscribe(); return ()=>sb.removeChannel(ch); },[conv.id,load]);
  useEffect(()=>{ endRef.current&&endRef.current.scrollIntoView({behavior:"smooth"}); },[msgs]);

  const send=async()=>{ const t=text.trim(); if(!t||sending) return; setSending(true); setText("");
    setMsgs(m=>[...(m||[]),{id:"tmp"+Date.now(),direction:"outbound",text:t,created_at:new Date().toISOString(),ig_message_id:null,sent_by:userId}]);
    const {error}=await sb.from("messages").insert([{conversation_id:conv.id,direction:"outbound",text:t,sent_by:userId}]);
    setSending(false); if(error) onToast("Erro ao enviar: "+error.message); };
  const setIA=async(modo)=>{ const patch=modo==="ia"?{ia_ativa:true,ia_pausada_ate:null}:{ia_ativa:false};
    const {error}=await sb.from("conversations").update(patch).eq("id",conv.id);
    if(error) return onToast("Não consegui mudar: "+error.message);
    onToast(modo==="ia"?"Conversa devolvida pra IA 🤖":"Você assumiu a conversa 🙋"); };
  const setStage=async(id)=>{ const {error}=await sb.from("conversations").update({stage_id:id}).eq("id",conv.id); if(error) onToast("Erro: "+error.message); };
  const limparAcao=async()=>{ await sb.from("conversations").update({next_action:null,next_action_at:null}).eq("id",conv.id); };

  let lastDay="";
  return h("div",{className:"thread"},
    h("div",{className:"th"},
      h("button",{className:"btn ghost sm back",onClick:onBack},"←"),
      h("div",{className:"avatar"},initials(nomeDe(ct))),
      h("div",{style:{flex:1,minWidth:0}},
        h("div",{className:"nm"},nomeDe(ct)),
        h("div",{className:"hd"},h("a",{href:"https://wa.me/"+String(ct.phone||"").replace(/\D/g,""),target:"_blank",style:{color:"inherit"}},fmtFone(ct.phone)))),
      h("div",{className:"acts"},
        h("select",{value:conv.stage_id||"",onChange:e=>setStage(e.target.value),title:"Etapa no Pipeline do CRM"},
          h("option",{value:""},"Sem etapa"), stages.map(s=>h("option",{key:s.id,value:s.id},s.name))),
        st==="ia"&&h("button",{className:"btn ghost sm iabtn on",onClick:()=>setIA("time"),title:"A IA está respondendo. Clique pra assumir."},"🤖 IA atendendo · assumir"),
        st==="pausa"&&h("button",{className:"btn ghost sm iabtn pausa",onClick:()=>setIA("ia"),title:"O time respondeu, a IA está pausada. Clique pra devolver agora."},"⏸ IA pausada · devolver"),
        st==="time"&&h("button",{className:"btn ghost sm iabtn off",onClick:()=>setIA("ia"),title:"O time está no controle. Clique pra devolver pra IA."},"🙋 Time no controle · devolver"))),
    conv.next_action&&h("div",{className:"banner info",style:{display:"flex",gap:10,alignItems:"center"}},
      h("div",{style:{flex:1}},h("b",null,"Próxima ação: "),conv.next_action),
      h("button",{className:"btn ghost sm",onClick:limparAcao},"✓ resolvido")),
    h("div",{className:"msgs"},
      msgs===null&&h("div",{className:"center"},h("div",{className:"spin"})),
      msgs&&msgs.length===0&&h("div",{className:"center",style:{fontSize:13}},"Sem mensagens ainda."),
      msgs&&msgs.map(m=>{
        const d=dia(m.created_at); const sep=d!==lastDay; lastDay=d;
        const ia=m.direction==="outbound"&&m.sender_id==="ia";
        const erro=m.raw&&m.raw.erro;
        return h(Fr,{key:m.id},
          sep&&h("div",{className:"datesep"},d),
          h("div",{className:"bubble "+(m.direction==="outbound"?"out":"in")+(ia?" ia":"")},
            ia&&h("div",{className:"autor"},"🤖 IA"),
            h("div",{style:{whiteSpace:"pre-wrap"}},m.text),
            h("div",{className:"t"},hora(m.created_at),
              m.direction==="outbound"&&!m.ig_message_id?(erro?h("span",{style:{color:"#DC2626",fontWeight:800,opacity:1}}," · ⚠️ não enviado: "+erro):" · enviando…"):"")));
      }),
      h("div",{ref:endRef})),
    foraJanela(conv)&&h("div",{className:"banner warn",style:{marginBottom:8}},"⏰ Passou de 24h desde a última mensagem do cliente. A Meta só deixa enviar template aprovado até ele responder de novo."),
    h("div",{className:"composer"},
      h("textarea",{rows:"1",placeholder:st==="ia"?"Escreva pra assumir a conversa (a IA pausa 12h)…":"Escreva uma resposta…",value:text,onChange:e=>setText(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }}),
      h("button",{className:"btn gold",onClick:send,disabled:sending},"Enviar")));
}

/* ---------- app ---------- */
const FILTROS=[["todas","Todas"],["time","🙋 Precisa do time"],["ia","🤖 IA atendendo"],["naolidas","● Não lidas"]];
function Atendimento({session}){
  const [convs,setConvs]=useState(null),[stages,setStages]=useState([]),[selId,setSelId]=useState(null);
  const [filtro,setFiltro]=useState("todas"),[busca,setBusca]=useState(""),[cfg,setCfg]=useState(false),[toast,setToast]=useState(""),[me,setMe]=useState(null);
  const onToast=useCallback(t=>{ setToast(t); setTimeout(()=>setToast(""),2600); },[]);
  const load=useCallback(async()=>{
    const {data,error}=await sb.from("conversations").select("*, contacts(*), kanban_stages(name,color)").eq("channel",CANAL).eq("is_archived",false).order("last_message_at",{ascending:false,nullsFirst:false}).limit(1000);
    if(error){ onToast("Erro: "+error.message); setConvs([]); return; }
    const ids=(data||[]).map(c=>c.id); let ult={};
    if(ids.length){ const r=await sb.from("messages").select("conversation_id,text,direction,sender_id,created_at").in("conversation_id",ids.slice(0,300)).order("created_at",{ascending:false}).limit(1500);
      (r.data||[]).forEach(m=>{ if(!ult[m.conversation_id]) ult[m.conversation_id]=m; }); }
    setConvs((data||[]).map(c=>Object.assign({},c,{_ult:ult[c.id]||null})));
  },[onToast]);
  useEffect(()=>{ load(); sb.from("kanban_stages").select("id,name,color").order("position").then(r=>setStages(r.data||[]));
    sb.from("team_members").select("full_name,email").eq("id",session.user.id).maybeSingle().then(r=>setMe(r.data)); },[load,session.user.id]);
  useEffect(()=>{ let t=null; const deb=()=>{ clearTimeout(t); t=setTimeout(load,400); };
    const ch=sb.channel("atend-oficial")
      .on("postgres_changes",{event:"*",schema:"public",table:"conversations",filter:"channel=eq."+CANAL},deb)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},deb).subscribe();
    return ()=>{ clearTimeout(t); sb.removeChannel(ch); }; },[load]);
  // título da aba com não lidas
  useEffect(()=>{ const n=(convs||[]).reduce((a,c)=>a+(c.unread_count||0),0); document.title=(n?"("+n+") ":"")+"Atendimento · Reino"; },[convs]);

  const cont={todas:0,time:0,ia:0,naolidas:0};
  (convs||[]).forEach(c=>{ cont.todas++; const e=estadoIA(c); if(e==="time")cont.time++; if(e!=="time")cont.ia++; if(c.unread_count>0)cont.naolidas++; });
  const q=busca.trim().toLowerCase();
  const lista=(convs||[]).filter(c=>{
    const e=estadoIA(c);
    if(filtro==="time"&&e!=="time") return false;
    if(filtro==="ia"&&e==="time") return false;
    if(filtro==="naolidas"&&!(c.unread_count>0)) return false;
    if(q){ const ct=c.contacts||{}; if(!((ct.full_name||"").toLowerCase().includes(q)||String(ct.phone||"").includes(q.replace(/\D/g,"")||"#"))) return false; }
    return true; });
  const sel=(convs||[]).find(c=>c.id===selId)||null;

  return h("div",{className:"app"+(sel?" sel-on":"")},
    h("aside",{className:"sidebar"},
      h("div",{className:"sb-logo"},
        h("svg",{width:26,height:25,viewBox:"0 0 88 84","aria-hidden":"true",style:{flexShrink:0}},
          h("g",{fill:"var(--sb-text)"},h("path",{d:"M12 72V12H68V44H44V28H28V72Z"}),h("path",{d:"M40 48H56L76 72H54L40 56Z"}))),
        h("span",{className:"nm"},"Reino ",h("b",null,"Atendimento"))),
      h("div",{className:"sb-label"},"WhatsApp Oficial"),
      h("nav",{className:"sb-nav"},
        FILTROS.map(f=>h("button",{key:f[0],className:"tab"+(filtro===f[0]?" active":"")+(f[0]==="time"&&cont.time>0?" hot":""),onClick:()=>{ setFiltro(f[0]); setSelId(null); }},f[1],h("span",{className:"cnt"},cont[f[0]]))),
        h("button",{className:"tab",onClick:()=>setCfg(true)},"⚙️ IA do Oficial")),
      h("div",{className:"sb-label"},"Reino"),
      h("a",{className:"sb-link",href:"../"},"← Voltar ao CRM"),
      h("div",{className:"sb-foot"},
        h("div",{className:"av"},initials((me&&me.full_name)||session.user.email)),
        h("div",{style:{minWidth:0}},h("div",{className:"un"},(me&&me.full_name)||session.user.email),h("div",{className:"us"},"Atendimento")))),
    h("div",{className:"main"},
      h("div",{className:"topbar"},
        h("div",{className:"crumb"},"Atendimento · WhatsApp Oficial"),
        h(ThemeToggle,null),
        h("button",{className:"out",onClick:()=>sb.auth.signOut()},"sair")),
      h("div",{className:"inbox"+(sel?" has-sel":"")},
        h("div",{className:"clist"},
          h("div",{className:"lhead"},h("input",{placeholder:"Buscar nome ou telefone…",value:busca,onChange:e=>setBusca(e.target.value)})),
          h("div",{className:"citems"},
            convs===null&&h("div",{className:"center"},h("div",{className:"spin"})),
            convs&&lista.length===0&&h("div",{className:"empty"},convs.length?"Nada neste filtro.":"Nenhuma conversa ainda. Elas aparecem aqui quando alguém chamar o número oficial."),
            lista.map(c=>{ const ct=c.contacts||{}; const e=estadoIA(c); const u=c._ult;
              return h("div",{key:c.id,className:"conv"+(c.id===selId?" sel":""),onClick:()=>setSelId(c.id)},
                h("div",{className:"avatar"},initials(nomeDe(ct))),
                h("div",{className:"info"},
                  h("div",{className:"top"},h("div",{className:"nm"},nomeDe(ct)),h("div",{className:"tm"},timeAgo(c.last_message_at))),
                  h("div",{className:"pv"},u?((u.direction==="outbound"?(u.sender_id==="ia"?"🤖 ":"Você: "):"")+(u.text||"")):(c.kanban_stages?c.kanban_stages.name:"")),
                  h("div",{style:{display:"flex",gap:6,marginTop:5,alignItems:"center"}},
                    h("span",{className:"pill "+e},e==="ia"?"🤖 IA":e==="pausa"?"⏸ pausada":"🙋 time"),
                    c.kanban_stages&&h("span",{className:"tag"},c.kanban_stages.name),
                    h("div",{style:{flex:1}}),
                    c.unread_count>0&&h("span",{className:"badge"},c.unread_count))));
            }))),
        sel?h(Thread,{key:sel.id,conv:sel,stages:stages,userId:session.user.id,onBack:()=>setSelId(null),onToast:onToast})
           :h("div",{className:"thread"},h("div",{className:"center"},h("div",null,h("div",{className:"big"},"💬"),"Selecione uma conversa"))))),
    cfg&&h(IAConfig,{onClose:()=>setCfg(false),onToast:onToast}),
    toast&&h("div",{className:"toast"},toast));
}

function App(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  useEffect(()=>{ const el=document.getElementById("root"); if(el) el.setAttribute("data-mounted","1"); },[]);
  if(session===undefined) return h("div",{className:"login"},h("div",{className:"spin"}));
  if(!session) return h(Login);
  return h(Atendimento,{session:session});
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
