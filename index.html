    --on-primary:#F5F3ED; --accent:#FF4D00; --surface2:#EFEAE3;

    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#210C13; --card:#3B101D; --ink:#F5F3ED; --muted:#C6A9B0;
    --line:rgba(245,243,237,.14); --gold:#F5F3ED; --gold-soft:rgba(255,77,0,.16);
    --on-primary:#210C13; --accent:#FF4D00; --surface2:#4A1420;

    color-scheme:dark;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(201,168,76,.35);border-radius:4px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
  .sidebar{background:var(--sidebar);color:var(--sb-text);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
  .sb-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 2px}
  .sb-logo .nm{font-weight:800;font-size:18px;color:var(--sb-text);line-height:1}
  .sb-logo .nm b{color:var(--accent)}
  .sb-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;padding:16px 10px 6px}
  .sb-nav{display:flex;flex-direction:column;gap:2px}
  .sb-nav .tab{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sb-muted);text-align:left;background:transparent;border:1px solid transparent;cursor:pointer;transition:.12s}
  .sb-nav .tab:hover{background:rgba(255,255,255,.07);color:var(--sb-text)}
  .sb-nav .tab.active{background:rgba(255,255,255,.11);color:var(--sb-text)}
  .sb-nav .tab.dragging{opacity:.5}
  .sb-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.12)}
  .sb-foot .av{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.13);color:var(--sb-text);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex-shrink:0}
  .sb-foot .un{font-size:12.5px;font-weight:700;color:var(--sb-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .sb-foot .us{font-size:11px;color:var(--sb-muted)}
  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .crumb{font-size:15px;font-weight:700;color:var(--ink);flex:1}

    .sidebar{flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;gap:4px;padding:8px 10px}
    .sb-label,.sb-foot{display:none}
    .sb-logo{flex-shrink:0}
    .sb-nav{flex-direction:row;gap:4px}
    .sb-nav .tab{white-space:nowrap}
    .main{flex:1;overflow:hidden}

  .login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;margin-bottom:11px;outline:none}
  .login input:focus{border-color:var(--gold)}
  .login button{width:100%;padding:12px;border-radius:11px;background:var(--gold);color:var(--on-primary);font-weight:700;font-size:15px}
  .login .err{color:#DC2626;font-size:13px;margin-bottom:10px}

  .tabs{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .tab{padding:8px 13px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s}
  .tab:hover{background:var(--bg)}.tab.active{background:var(--gold);color:var(--on-primary)}
  .who{font-size:12.5px;color:var(--muted)}
  .out{font-size:12.5px;color:var(--muted);text-decoration:underline}
  .search{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:200px;outline:none}

  .btn.sm{padding:6px 11px;font-size:13px}.danger{background:#FEF2F2;color:#DC2626}

  .subtabs{display:flex;gap:6px;padding:10px 20px 0}
  .subtab{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line)}
  .subtab.active{background:var(--gold-soft);color:var(--gold);border-color:transparent}

  .board::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:8px}
  .board::-webkit-scrollbar-thumb{background:var(--gold);border-radius:8px;border:3px solid var(--bg)}

  .empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}

  .overlay{position:fixed;inset:0;background:rgba(20,18,14,.45);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:var(--card);border-radius:18px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:24px}

  .conv .top{display:flex;justify-content:space-between;gap:8px}
  .conv .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .conv .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{background:var(--gold);color:var(--on-primary);font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;min-width:20px;height:20px;display:grid;place-items:center}
  .thread{flex:1;display:flex;flex-direction:column;background:var(--bg)}
  .thread .th{padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .thread .th .nm{font-weight:700}.thread .th .hd{font-size:12.5px;color:var(--muted)}
  .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
  .bubble{max-width:64%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word}
  .bubble.in{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .bubble.out{background:var(--gold);color:var(--on-primary);align-self:flex-end;border-bottom-right-radius:4px}
  .bubble .t{font-size:10px;opacity:.55;margin-top:4px;text-align:right}
  .composer{padding:12px 16px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;resize:none;outline:none;max-height:120px}
  .composer textarea:focus{border-color:var(--gold)}
  .center{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px}
  .center .big{font-size:46px;margin-bottom:10px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}

  /* ===== MOBILE ===== */
  @media (max-width:680px){
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
    .logo{font-size:16px}
    .tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;padding-bottom:2px}
    .tab{white-space:nowrap;font-size:13px;padding:8px 11px}
    .search{flex:1;min-width:0;width:auto}
    .subtabs{padding:8px 12px 0}
    .board{gap:10px;padding:12px 12px;scroll-snap-type:x mandatory}
    .col{width:86vw;min-width:86vw;scroll-snap-align:start;max-height:none}
    .col-body{max-height:none}
    .inbox{flex-direction:column}
    .clist{width:100%;min-width:0;max-height:42vh;border-right:none;border-bottom:1px solid var(--line)}
    .thread{min-height:55vh}
    .bubble{max-width:82%}
    .modal{max-width:96vw}
    .overlay{padding:0}
    .overlay>div{max-width:100vw!important;width:100vw!important;height:100vh!important;border-radius:0!important;flex-direction:column!important}
    .row{flex-direction:column}
    .out,.btn.sm{padding:7px 10px}
  }
</style>

/* ===================== BARRA DE ROLAGEM HORIZONTAL (topo do quadro) ===================== */
function BoardScroller(props){
  const ref=useRef(null), barRef=useRef(null), thumbRef=useRef(null);
  const sync=()=>{ var el=ref.current,th=thumbRef.current; if(!el||!th)return;
    var sw=el.scrollWidth||1; th.style.width=Math.max((el.clientWidth/sw)*100,6)+"%";
    th.style.left=((el.scrollLeft/sw)*100)+"%"; };
  useEffect(()=>{ sync(); var el=ref.current; if(!el)return;
    el.addEventListener("scroll",sync); window.addEventListener("resize",sync); var id=setTimeout(sync,400);
    return ()=>{el.removeEventListener("scroll",sync);window.removeEventListener("resize",sync);clearTimeout(id);}; });
  const onDown=(e)=>{ var el=ref.current,bar=barRef.current; if(!el||!bar)return;
    var startX=e.clientX, startLeft=el.scrollLeft, w=bar.clientWidth||1, sw=el.scrollWidth;
    var mv=ev=>{ el.scrollLeft=startLeft+(ev.clientX-startX)*(sw/w); };
    var up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);document.body.style.userSelect="";};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);document.body.style.userSelect="none"; e.preventDefault(); };
  const onTrack=(e)=>{ if(e.target!==barRef.current)return; var el=ref.current,bar=barRef.current;
    var rect=bar.getBoundingClientRect(); el.scrollLeft=((e.clientX-rect.left)/rect.width)*el.scrollWidth-el.clientWidth/2; };
  return h(Fr,null,
    h("div",{ref:barRef,onMouseDown:onTrack,style:{margin:"10px 20px 0",height:13,background:"rgba(0,0,0,.07)",borderRadius:7,position:"relative",cursor:"pointer"}},
      h("div",{ref:thumbRef,onMouseDown:onDown,style:{position:"absolute",top:1,bottom:1,left:0,width:"20%",background:"var(--gold)",borderRadius:6,cursor:"grab"}})
    ),
    h("div",{className:"board",ref:ref},props.children)
  );
}

function StagesManager({onClose}){
  const [stages,setStages]=useState(null);
  const [changed,setChanged]=useState(false);
  const load=()=>sb.from("kanban_stages").select("*").order("position").then(({data})=>setStages(data||[]));
  useEffect(()=>{load();},[]);
  const close=()=>{ if(changed) location.reload(); else onClose(); };
  const rename=async(st,name)=>{ name=(name||"").trim(); if(!name||name===st.name)return;
    await sb.from("kanban_stages").update({name:name}).eq("id",st.id);
    await sb.from("leads").update({status:name}).eq("status",st.name);
    setChanged(true); setStages(ss=>ss.map(x=>x.id===st.id?{...x,name:name}:x)); };
  const recolor=async(st,color)=>{ await sb.from("kanban_stages").update({color:color}).eq("id",st.id);
    setChanged(true); setStages(ss=>ss.map(x=>x.id===st.id?{...x,color:color}:x)); };
  const move=async(i,dir)=>{ const j=i+dir; if(j<0||j>=stages.length)return; const a=stages[i],b=stages[j];
    await sb.from("kanban_stages").update({position:b.position}).eq("id",a.id);
    await sb.from("kanban_stages").update({position:a.position}).eq("id",b.id);
    const arr=stages.slice(); arr[i]={...a,position:b.position}; arr[j]={...b,position:a.position};
    arr.sort((x,y)=>x.position-y.position); setStages(arr); setChanged(true); };
  const add=async()=>{ const maxp=stages.reduce((m,s)=>Math.max(m,s.position||0),0);
    const {data}=await sb.from("kanban_stages").insert([{name:"Nova etapa",color:"#9CA3AF",position:maxp+1}]).select();
    setChanged(true); if(data)setStages(ss=>[...ss,data[0]]); };

    const ld=await sb.from("leads").select("id",{count:"exact",head:true}).eq("status",st.name);
    if(((cv.count||0)+(ld.count||0))>0){ alert("Essa etapa tem cards. Mova os cards antes de excluir."); return; }
    if(!confirm('Excluir a etapa "'+st.name+'"?'))return;
    await sb.from("kanban_stages").delete().eq("id",st.id);
    setChanged(true); setStages(ss=>ss.filter(x=>x.id!==st.id)); };
  return h("div",{className:"overlay",onClick:close},
    h("div",{className:"modal",style:{maxWidth:540},onClick:e=>e.stopPropagation()},
      h("h3",null,"Gerenciar etapas"),
      h("div",{style:{fontSize:12.5,color:"var(--muted)",marginBottom:14}},"Vale para Instagram, WhatsApp e Vendas/Evento (funil unificado). O CS tem etapas próprias."),
      stages===null?h("div",{className:"center"},h("div",{className:"spin"})):
      h("div",null, stages.map((st,i)=>h("div",{key:st.id,style:{display:"flex",gap:8,alignItems:"center",marginBottom:8}},
        h("div",{style:{display:"flex",flexDirection:"column",gap:2}},
          h("button",{className:"btn ghost sm",style:{padding:"0 6px",lineHeight:"1.2"},onClick:()=>move(i,-1)},"▲"),
          h("button",{className:"btn ghost sm",style:{padding:"0 6px",lineHeight:"1.2"},onClick:()=>move(i,1)},"▼")
        ),
        h("input",{type:"color",value:st.color||"#9CA3AF",onChange:e=>recolor(st,e.target.value),style:{width:36,height:36,border:"none",background:"none",cursor:"pointer",padding:0}}),
        h("input",{defaultValue:st.name,onBlur:e=>rename(st,e.target.value),style:{flex:1,padding:"9px 11px",border:"1px solid var(--line)",borderRadius:9,fontSize:14}}),

        return h("div",{key:b.key,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,minWidth:0}},

                );
              })
          );
        })
      ),
    h("div",{style:{marginTop:12,fontSize:11.5,color:"var(--muted)"}},"Agenda do Google — Mateus + Thiago.")
  );
}

/* ===================== APP ===================== */
function Shell({session}){
  const [tab,setTab]=useState("painel");
  const [sub,setSub]=useState("inbox");
  const [search,setSearch]=useState(""),[toast,setToast]=useState(null);
  const [showStages,setShowStages]=useState(false);
  const [me,setMe]=useState(null),[account,setAccount]=useState(null);
  const [tabOrder,setTabOrder]=useState([]),[dragTab,setDragTab]=useState(null);
  const onToast=m=>{setToast(m);setTimeout(()=>setToast(null),4000);};
  useEffect(()=>{
    sb.from("team_members").select("full_name,role").eq("id",session.user.id).maybeSingle().then(({data})=>setMe(data));
    sb.from("instagram_accounts").select("id,ig_user_id,username,is_active").eq("is_active",true).limit(1).maybeSingle().then(({data})=>setAccount(data));
    try{ var s=JSON.parse(localStorage.getItem("reino_tab_order")||"[]"); if(Array.isArray(s)) setTabOrder(s); }catch(e){}
  },[]);
  const saveOrder=(arr)=>{ setTabOrder(arr); try{ localStorage.setItem("reino_tab_order",JSON.stringify(arr)); }catch(e){} };
  const isAdmin = me && me.role==="admin";
  var GROUPS=[
    ["Hoje",[["painel","Painel"],["rotinacris","Rotina do dia"],["rotina","Minhas tarefas"]]],
    ["Comercial",[["total","Pipeline"],["lowticket","Low ticket"],["agenda","Agenda"],["contatos","Contatos"],["contratos","Contratos presos"],["playbooks","Playbooks ↗"]]],
    ["Prospecção",[["ig","Instagram"],["whatsapp_cris","WhatsApp"]]],
    ["Entrega",[["onboarding","Onboarding"],["mentorados","Mentorados"],["trafego","Clientes"],["cs","CS / Pagamentos"]]],
    ["Gestão",[["relatorio","Desempenho"],["tarefas","Tarefas"],["time","Time"],["pesquisa","Pesquisa"]]]
  ];
  var ADMIN_ONLY={time:1,relatorio:1};
  var byKey={}; GROUPS.forEach(function(g){ g[1].forEach(function(t){ byKey[t[0]]=t; }); });
  var visGroups=GROUPS.map(function(g){ return [g[0], g[1].filter(function(t){ return isAdmin || !ADMIN_ONLY[t[0]]; })]; }).filter(function(g){ return g[1].length>0; });
  const isChannel = tab==="ig"||tab==="whatsapp_cris";
  return h("div",{className:"app"},
    h("aside",{className:"sidebar"},
      h("div",{className:"sb-logo"},
        h("svg",{width:26,height:25,viewBox:"0 0 88 84","aria-hidden":"true",style:{flexShrink:0}},
          h("g",{fill:"var(--sb-text)"},
            h("path",{d:"M12 72V12H68V44H44V28H28V72Z"}),
            h("path",{d:"M40 48H56L76 72H54L40 56Z"}))),
        h("span",{className:"nm"},"Reino ",h("b",null,"CRM"))),
      h("nav",{className:"sb-nav"},visGroups.map(function(g){ return [
        h("div",{className:"sb-label",key:"lbl-"+g[0]},g[0]),
        g[1].map(function(t){ var k=t[0],l=t[1]; return h("button",{key:k,className:"tab"+(tab===k?" active":""),onClick:function(){ if(k==="playbooks"){ window.open("https://hub-reino.pages.dev/playbooks/","_blank","noopener"); } else { setTab(k); } }},l); })
      ]; })),
      h("div",{className:"sb-foot"},
        h("div",{className:"av"},((me&&me.full_name?me.full_name:session.user.email)||"?").slice(0,2).toUpperCase()),
        h("div",{style:{minWidth:0}},
          h("div",{className:"un"},me?me.full_name:session.user.email),
          h("div",{className:"us"},"Ambiente comercial")))
    ),
    h("div",{className:"main"},
      h("div",{className:"topbar"},
        h("div",{className:"crumb"},byKey[tab]?byKey[tab][1]:""),
        h("input",{className:"search",placeholder:"Buscar...",value:search,onChange:e=>setSearch(e.target.value)}),
        h(ThemeToggle,null),
        h("button",{className:"out",style:{marginRight:4},onClick:()=>setShowStages(true)},"⚙ etapas"),
        h("button",{className:"out",onClick:()=>sb.auth.signOut()},"sair")
      ),
      isChannel&&h("div",{className:"subtabs"},
        h("button",{className:"subtab"+(sub==="inbox"?" active":""),onClick:()=>setSub("inbox")},"📥 Inbox"),
        h("button",{className:"subtab"+(sub==="pipe"?" active":""),onClick:()=>setSub("pipe")},"📊 Pipeline")
      ),
      tab==="ig"&&h(ChannelView,{channel:"instagram",sub:sub,search:search,account:account,userId:session.user.id,onToast:onToast}),
      tab==="whatsapp_cris"&&h(ChannelView,{channel:"whatsapp",sub:sub,search:search,account:account,userId:session.user.id,onToast:onToast}),
      tab==="evento_presencial"&&h(LeadsBoard,{pipeKey:"evento_presencial",search:search,onToast:onToast}),
      tab==="cs"&&h(CSBoard,{search:search,onToast:onToast,isAdmin:isAdmin}),
      tab==="onboarding"&&h(OnboardingView,{onToast:onToast}),
      tab==="total"&&h(TotalBoard,{search:search,account:account,userId:session.user.id,onToast:onToast}),
      tab==="rotina"&&h(RotinaView,{session:session,onToast:onToast,isAdmin:isAdmin}),
      tab==="agenda"&&h(AgendaView,{onToast:onToast}),
      tab==="tarefas"&&h(TarefasView,{onToast:onToast,session:session}),
      tab==="mentorados"&&h(MentoradosView,{onToast:onToast}),
      tab==="trafego"&&h(TrafegoView,{onToast:onToast}),
      tab==="contratos"&&h(ContratosPresosView,{onToast:onToast}),
      tab==="rotinacris"&&h(RotinaCrisView,{onToast:onToast}),
      tab==="lowticket"&&h(LowTicketBoard,{search:search,onToast:onToast,userId:session.user.id}),
      tab==="contatos"&&h(ContatosView,{search:search,onToast:onToast}),
      tab==="pesquisa"&&h(PesquisaView,{search:search,onToast:onToast}),
      tab==="painel"&&h(Dashboard,{onToast:onToast,email:session.user.email}),
      tab==="time"&&isAdmin&&h(TeamView,{onToast:onToast}),
      tab==="relatorio"&&isAdmin&&h(RelatorioView,{onToast:onToast})
    ),
    showStages&&h(StagesManager,{onClose:()=>setShowStages(false)}),
    toast&&h("div",{className:"toast"},toast)
  );
}

function ThemeToggle(){
  const [dark,setDark]=useState(function(){return document.documentElement.getAttribute("data-theme")==="dark";});
  return h("button",{className:"out",title:"Alternar tema claro/escuro",style:{marginRight:4},onClick:function(){var nd=!dark;document.documentElement.setAttribute("data-theme",nd?"dark":"light");try{localStorage.setItem("reino-theme",nd?"dark":"light");}catch(e){}setDark(nd);}}, dark?"☀ claro":"🌙 escuro");
}
function App(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{ const el=document.getElementById("root"); if(el) el.setAttribute("data-mounted","1"); },[]);
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:{subscription}}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>subscription.unsubscribe(); },[]);
  if(session===undefined)return h("div",{className:"login"},h("div",{className:"spin"}));
  if(!session)return h(Login);
  return h(Shell,{session:session});
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
